title:
  en_us: "PyPiPie Shell"
tooltip:
  en_us: >-
    PyPiPie Shell: a Python editor and REPL connected to the running Revit
    session. AvalonEdit editor with Python highlighting, Revit API
    autocomplete, signature help and hover tips; follows Revit's light/dark
    theme. Click to open in the saved mode (modeless by default);
    Shift+Click to choose Modeless, Modal or Docked. Runs real code
    against the model - use with care.
author: Aaron Rumple, AIA
help_url: "https://github.com/aaronrumple/PyPiPieShell"
context: zero-doc
engine:
  persistent: true
